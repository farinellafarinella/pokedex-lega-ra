  <script>
    // Adattatore qrcodejs per mantenere una singola API canvas in tutta la SPA.
    const QRCodeJS = window.QRCode;
    window.QRCode = {
      toCanvas(canvas, text, options = {}) {
        const size = options.width || 256;
        const margin = options.margin === 0 ? 0 : Math.max(16, Math.round(size * 0.06));
        const qrSize = size - margin * 2;
        const holder = document.createElement('div');
        new QRCodeJS(holder, {
          text,
          width: qrSize,
          height: qrSize,
          colorDark: options.color?.dark || '#111214',
          colorLight: options.color?.light || '#ffffff',
          correctLevel: QRCodeJS.CorrectLevel.M,
        });
        return new Promise((resolve, reject) => setTimeout(() => {
          const source = holder.querySelector('canvas,img');
          if (!source) return reject(new Error('QR non generato'));
          canvas.width = size;
          canvas.height = size;
          const context = canvas.getContext('2d');
          context.fillStyle = '#ffffff';
          context.fillRect(0, 0, size, size);
          context.imageSmoothingEnabled = false;
          context.drawImage(source, margin, margin, qrSize, qrSize);
          resolve(canvas);
        }, 0));
      },
    };
  </script>

        <header class="top"><div class="shell"><div class="logo"><span class="mark">CL</span><span>CHAMPION<small>LEAGUE</small></span></div><nav class="nav" id="nav"></nav><div style="display:flex;gap:6px"><button id="notification-button" class="btn secondary hidden" type="button" aria-label="Attiva notifiche" title="Attiva notifiche" onclick="enablePushNotifications()">🔔</button><button id="register-button" class="btn secondary" onclick="go('register')">Registrati</button><button id="auth-button" class="btn secondary" onclick="handleAuthButton()">Accedi</button></div></div></header>
        <main class="main shell" id="app"></main>
      </div>
      <div id="supabase-status" class="no-print supabase-status">Supabase: verifica…</div>
    </div>
  </div>
  <script>
    const recoveryURL=new URL(location.href),recoveryHash=new URLSearchParams(location.hash.slice(1));
    let passwordRecovery=recoveryURL.searchParams.get('recovery')==='1'||recoveryHash.get('type')==='recovery'||location.hash==='#reset-password';
    let recoveryError=recoveryURL.searchParams.get('error_description')||recoveryHash.get('error_description')||'';
    if(recoveryError)passwordRecovery=true;
    let authListenerInstalled=false,authRefreshTimer=null,recoveryEmail='';
    const supabaseConfig=window.CHAMPION_SUPABASE_CONFIG;
    const supabaseClient=supabaseConfig?.url&&supabaseConfig?.publishableKey
      ? window.supabase.createClient(supabaseConfig.url,supabaseConfig.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})
      : null;
    let authSession=null,remoteProfile=null,authReady=false,remoteDevicesLoaded=false,activeScanner=null,scannedRecipient=null,remoteRewards=[],remoteRewardsLoaded=false,remoteBadgeCodes=[],remoteBadgeCodesLoaded=false,remoteNotifications=[],notificationPoll=null,fossilHuntState=null,myGiftState=null,giftPreviewCode='',giftPreviewOptions=[],adminGiftCampaigns=[],adminGiftsLoaded=false;
    const badgeNames=['Roccia','Acqua','Elettro','Erba','Veleno','Psico','Fuoco','Terra'];
    const trainerClasses=[
      {name:'Bullo',gender:'male'},{name:'Bulla',gender:'female'},
      {name:'Scienziato',gender:'male'},{name:'Scienziata',gender:'female'},
      {name:'Artista',gender:'both'},
      {name:'Fantallenatore',gender:'male'},{name:'Fantallenatrice',gender:'female'},
      {name:'Nobile',gender:'both'},
      {name:'Campeggiatore',gender:'male'},{name:'Campeggiatrice',gender:'female'},
      {name:'Modello',gender:'male'},{name:'Modella',gender:'female'},
      {name:'Medium',gender:'both'},
      {name:'Karateka',gender:'both'},
      {name:'Allenatore',gender:'male'},{name:'Allenatrice',gender:'female'}
    ];
    const trainerClassFiles={
      'Bullo':'personaggio bullo maschio.png','Bulla':'personaggio bullo femmina.png',
      'Scienziato':'personaggio scienziato maschio.png','Scienziata':'personaggio scienziato femmina.png',
      'male:Artista':'personaggio artista maschio.png','female:Artista':'personaggio artista femmina.png',
      'Fantallenatore':'personaggio fantallenatore maschio.png','Fantallenatrice':'personaggio fantallenatrice femmina.png',
      'male:Nobile':'personaggio nobile maschio.png','female:Nobile':'personaggio nobile femmina.png',
      'Campeggiatore':'personaggio campeggiatore maschio.png','Campeggiatrice':'personaggio campeggiatrice femmina.png',
      'Modello':'personaggio modello maschio.png','Modella':'personaggio modella femmina.png',
      'male:Medium':'personaggio medium maschio.png','female:Medium':'personaggio medium femmina.png',
      'male:Karateka':'personaggio karateka maschio.png','female:Karateka':'personaggio karateka femmina.png',
      'Allenatore':'personaggio allenatore maschio.png','Allenatrice':'personaggio allenatrice femmina.png'
    };
    const trainerClassImage=(trainerClass,gender)=>trainerClassFiles[`${gender}:${trainerClass}`]||trainerClassFiles[trainerClass]||trainerClassFiles.Allenatore;
    const classesForGender=gender=>trainerClasses.filter(x=>x.gender===gender||x.gender==='both');
    const giftPokemonSuggestions=['Arcanine','Beedrill','Butterfree','Carvanha','Caterpie','Chinchou','Corsola','Dodrio','Feebas','Goldeen','Heracross','Horsea','Kakuna','Krabby','Ledyba','Magikarp','Metapod','Paras','Pinsir','Poliwag','Rapidash','Raticate','Remoraid','Scyther','Shellder','Spinarak','Staryu','Tauros','Tentacool','Venonat','Weedle'];
    const badgeFiles=[
      ['Mroccia.png','Mroccia block.png'],
      ['Macqua.png','Macqua block.png'],
      ['Melettro.png','Melettro block.png'],
      ['Merba.png','Merba block.png'],
      ['Mveleno.png','Mveleno block.png'],
      ['Mpisco.png','Mpisco block.png'],
      ['Mfuoco.png','Mfuoco block.png'],
      ['Mterra.png','Mterra block.png']
    ];
    const gymLeaderFiles=['brock palestra.png','misty palestra.png','lt surge palestra.png','erika palestra.png','koga palestra.png','sabrina palestra.png','blaine palestra.png','giovanni palestra.png'];
    const initialGyms=[];
    const initialRocketEvents=[];
    const initialRocketPokemon=[];
    let state=JSON.parse(localStorage.getItem('champion-league')||'null')||{trainers:[],transactions:[],gyms:initialGyms,registrations:[],rocketEvents:initialRocketEvents,rocketPokemon:initialRocketPokemon,rocketPurchases:[]};
    state.trainers=[];state.transactions=[];state.gyms=[];state.registrations=state.registrations||[];state.devices=state.devices||[];state.activationAttempts=state.activationAttempts||[];state.rocketEvents=[];state.rocketPokemon=[];state.rocketPurchases=state.rocketPurchases||[];
    const me=()=>remoteProfile||trainer(state.currentTrainerId)||state.trainers[0], money=n=>'₽ '+Number(n).toLocaleString('it-IT'), trainer=id=>state.trainers.find(t=>t.id===id), ranking=()=>[...state.trainers].sort((a,b)=>b.balance-a.balance||a.name.localeCompare(b.name,'it')), save=()=>localStorage.setItem('champion-league',JSON.stringify(state));
    const navItems=[['dashboard','Home'],['events','Eventi'],['rocket-list','Rocket'],['my-tickets','Biglietti'],['transactions','Movimenti'],['ranking','Classifica'],['admin','Admin']];
    function go(page,param=''){location.hash=page+(param?'/'+param:'')}
    function header(k,t,s){return `<div class="eyebrow">${k}</div><h1 class="title">${t}</h1><p class="sub">${s||''}</p>`}
    function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function gymLeader(g){let position=Number(g.badgeNumber)||badgeNames.findIndex(x=>x.toLowerCase()===String(g.badge||'').toLowerCase())+1,file=gymLeaderFiles[position-1];return file?`<figure class="gym-leader"><img src="./${encodeURIComponent(file)}" alt="Capopalestra ${badgeNames[position-1]||''}"><figcaption>${badgeNames[position-1]||''}</figcaption></figure>`:''}
    function gymStatus(g){let now=Date.now(),eventAt=new Date(g.date).getTime();if(eventAt<now)return {label:'Conclusa',className:'used'};if(g.open)return {label:'Iscrizioni aperte',className:'valid'};if(new Date(g.openAt).getTime()>now)return {label:'Programmata',className:'ready'};return {label:'Iscrizioni chiuse',className:'cancelled'}}
    function featuredGym(){let now=Date.now(),future=state.gyms.filter(g=>new Date(g.date).getTime()>=now).sort((a,b)=>new Date(a.date)-new Date(b.date));return state.gyms.find(g=>g.open&&new Date(g.date).getTime()>=now)||future[0]||[...state.gyms].sort((a,b)=>new Date(b.date)-new Date(a.date))[0]}
    function gymListRow(g){let status=gymStatus(g);return `<div class="row"><span class="rank">◆</span><span><b>${g.name}</b><small class="muted" style="display:block">${g.badge} · ${new Date(g.date).toLocaleString('it-IT')} · ${g.location}</small></span><span class="status ${status.className}">${status.label}</span></div>`}
    function italianDateTime(value){let d=new Date(value),parts=new Intl.DateTimeFormat('it-IT',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d),get=t=>parts.find(p=>p.type===t)?.value;return `${get('day')}/${get('month')}/${get('year')} ${get('hour')}:${get('minute')}`}
    function parseItalianDateTime(value){let match=String(value).trim().match(/^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})$/);if(!match)return null;let [,day,month,year,hour,minute]=match,d=new Date(Number(year),Number(month)-1,Number(day),Number(hour),Number(minute));return d.getFullYear()===Number(year)&&d.getMonth()===Number(month)-1&&d.getDate()===Number(day)&&d.getHours()===Number(hour)&&d.getMinutes()===Number(minute)?d:null}
    function dateTimeLocalValue(value){let d=new Date(value),pad=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`}
    function italyWeekday(){let label=new Intl.DateTimeFormat('en-US',{timeZone:'Europe/Rome',weekday:'short'}).format(new Date());return ({Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6})[label]}
    function badgeGrid(value){let earned=Array.isArray(value)?value:null,count=earned?earned.length:Number(value)||0;return `<div class="badges">${badgeNames.map((b,i)=>{let unlocked=earned?earned.includes(i+1):i<count,file=badgeFiles[i][unlocked?0:1],psico=b==='Psico';return `<div title="${b} · ${unlocked?'conquistata':'bloccata'}" class="badge ${psico?'badge-psico':''} ${unlocked?'on':''}">${psico&&!unlocked?'<span class="psico-block-shape" aria-label="Medaglia Psico bloccata"></span>':`<img src="./${encodeURIComponent(file)}" alt="Medaglia ${b} ${unlocked?'conquistata':'bloccata'}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="badge-fallback" style="display:none">${unlocked?'◆':'●'}</span>`}<small>${b}</small></div>`}).join('')}</div>`}
    function trainerCard(t,isPublic=false){let pos=ranking().findIndex(x=>x.id===t.id)+1,trainerClass=t.trainerClass||'Allenatore',trainerGender=t.trainerGender||'male',avatar=trainerClassImage(trainerClass,trainerGender);return `<section class="panel profile"><div class="bar"></div><div class="pad"><div class="profile-head"><div style="display:flex;gap:16px;align-items:flex-start"><div class="trainer-avatar"><img src="./${encodeURIComponent(avatar)}" alt="${escapeHtml(trainerClass)}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="trainer-avatar-fallback" style="display:none">${escapeHtml(trainerClass.slice(0,1))}</span></div><div><div class="eyebrow">${escapeHtml(trainerClass)}</div><h2>${escapeHtml(t.name)}</h2><div class="chips"><span class="chip"># ${escapeHtml(t.code)}</span><span class="chip">${trainerGender==='female'?'Femmina':'Maschio'}</span><span class="chip">Iscritto il ${new Date(t.date).toLocaleDateString('it-IT')}</span></div>${isPublic?'':`<div class="form-actions profile-edit-actions no-print"><button class="btn secondary" onclick="changeTrainerName()">Modifica nome</button><button class="btn secondary" onclick="showTrainerClassPicker()">Personalizza profilo</button></div>`}</div></div>${isPublic?'':`<div class="balance"><small>SALDO DISPONIBILE</small><b>${money(t.balance)}</b></div>`}</div><div class="rule"></div><div style="display:flex;justify-content:space-between"><b>Medaglie</b><b class="yellow">${t.badges} / 8</b></div><div style="margin-top:14px">${badgeGrid(t.badgePositions||t.badges)}</div><div class="stats"><div class="stat"><small>Posizione</small><b>${pos}° posto</b></div><div class="stat"><small>Saldo classifica</small><b>${money(t.balance)}</b></div></div>${isPublic?`<button class="btn primary no-print" style="width:100%;margin-top:18px" onclick="go('transfer','${t.code}')">Invia Pokédollari</button>`:''}</div></section>`}
    async function changeTrainerName(){let value=prompt('Nuovo Nome Allenatore',me().name);if(value===null)return;value=value.trim();if(value.length<2||value.length>60)return alert('Il nome deve contenere da 2 a 60 caratteri.');if(!confirm(`Cambiare il Nome Allenatore in “${value}”?\n\nIl Codice Allenatore ${me().code} resterà invariato.`))return;let {error}=await supabaseClient.rpc('update_my_trainer_name',{p_trainer_name:value});if(error){alert(error.message.includes('NOT_FOUND_OR_INACTIVE')?'Profilo non trovato o account non attivo.':'Modifica non riuscita. Usa solo lettere, numeri, spazi e i caratteri . _ -');return}await loadRemoteProfile();render();alert('Nome Allenatore aggiornato.')}
    function trainerClassOptions(gender,selected){return classesForGender(gender).map(x=>`<button type="button" class="trainer-class-option ${x.name===selected?'selected':''}" onclick="selectTrainerClass(this,'${x.name}')">${x.name}</button>`).join('')}
    function showTrainerClassPicker(){let gender=me().trainerGender||'male',selected=me().trainerClass||'Allenatore',modal=document.createElement('div');modal.id='trainer-class-modal';modal.className='modal-backdrop';modal.innerHTML=`<section class="panel pad modal-card"><span class="eyebrow">Personalizzazione account</span><h2>Scegli sesso e Classe Allenatore</h2><label>Sesso<select id="selected-trainer-gender" class="field" onchange="refreshTrainerClassPicker()"><option value="male" ${gender==='male'?'selected':''}>Maschio</option><option value="female" ${gender==='female'?'selected':''}>Femmina</option></select></label><input id="selected-trainer-class" type="hidden" value="${escapeHtml(selected)}"><div id="trainer-class-options" class="trainer-class-grid">${trainerClassOptions(gender,selected)}</div><div id="trainer-class-error"></div><div class="form-actions"><button class="btn primary" onclick="saveTrainerClass()">Salva profilo</button><button class="btn secondary" onclick="document.querySelector('#trainer-class-modal').remove()">Annulla</button></div></section>`;document.body.appendChild(modal)}
    function refreshTrainerClassPicker(){let gender=document.querySelector('#selected-trainer-gender').value,first=classesForGender(gender)[0];document.querySelector('#selected-trainer-class').value=first.name;document.querySelector('#trainer-class-options').innerHTML=trainerClassOptions(gender,first.name)}
    function selectTrainerClass(button,value){document.querySelector('#selected-trainer-class').value=value;document.querySelectorAll('.trainer-class-option').forEach(x=>x.classList.toggle('selected',x===button))}
    async function saveTrainerClass(){let gender=document.querySelector('#selected-trainer-gender').value,value=document.querySelector('#selected-trainer-class').value,box=document.querySelector('#trainer-class-error'),{error}=await supabaseClient.rpc('update_my_trainer_identity',{p_trainer_gender:gender,p_trainer_class:value});if(error){box.innerHTML='<div class="notice">Salvataggio non riuscito. Esegui nuovamente trainer-customization.sql su Supabase.</div>';return}document.querySelector('#trainer-class-modal').remove();await Promise.all([loadRemoteProfile(),loadPublicTrainers()]);render();alert('Profilo Allenatore aggiornato.')}
    function dashboard(){let event=state.rocketEvents.find(e=>e.active),preview=state.rocketPokemon.filter(p=>p.eventId===event?.id).slice(0,3);return header('Area personale',`Ciao, ${me().name.split(' ')[0]}.`,'I tuoi progressi e i prossimi eventi della Lega.')+`<div class="grid cols">${trainerCard(me())}<aside><section class="panel pad"><b>Azioni rapide</b><div class="actions"><button class="btn primary with-icon" onclick="go('scan')"><img class="btn-icon" src="./icon%20qr.png" alt="">Scansiona QR</button><button class="btn secondary with-icon" onclick="go('transfer')"><img class="btn-icon" src="./pokedollaro%20icon.png" alt="">Invia Pokédollari</button><button class="btn secondary with-icon" onclick="go('my-tickets')"><img class="btn-icon" src="./gym%20icon.png" alt="">I miei biglietti</button><button class="btn secondary with-icon" onclick="go('rocket-list')"><img class="btn-icon" src="./icon%20rocket.png" alt="">Lista Rocket</button><button class="btn secondary with-icon" onclick="go('ranking')"><img class="btn-icon" src="./classifica%20icon.png" alt="">Classifica</button><button class="btn secondary with-icon" onclick="go('transactions')"><img class="btn-icon" src="./movimenti%20icon.png" alt="">Storico movimenti</button><button class="btn secondary with-icon" onclick="go('qr')"><img class="btn-icon" src="./pokeball%20icon.png" alt="">Il mio QR</button></div></section></aside></div><div class="feature-grid" style="margin-top:20px"><article class="feature" style="grid-column:span 2"><span class="eyebrow">Prossimo Team Rocket</span><b>${event?.name||'In programmazione'}</b><small class="muted">${event?new Date(event.date).toLocaleString('it-IT'):''}</small><div class="participants" style="margin-top:12px">${preview.map(p=>`<span class="chip">${p.name} · ${money(p.price)}</span>`).join('')}</div><button class="btn primary" style="width:100%;margin-top:15px" onclick="go('rocket-list')">Visualizza Pokémon disponibili</button></article></div>`}
    function txLine(x){let incoming=x.to===me().id,peer=trainer(incoming?x.from:x.to),neutral=!x.from&&!x.to;return `<div class="tx-row"><span><b>${peer?.name||'Lega Pokémon'}</b><small class="muted" style="display:block">${x.note||'Nessuna causale'} · ${new Date(x.date).toLocaleString('it-IT')}</small></span><b class="${incoming||neutral?'green':''}">${incoming||neutral?'+':'-'}${money(x.amount)}</b></div>`}
    function rankingPage(){return header('Classifica generale','La corsa al vertice','La posizione dipende dal saldo Pokédollari di ogni allenatore.')+`<section class="panel list">${ranking().map((t,i)=>`<div class="row" onclick="go('trainer','${t.code}')"><span class="rank ${i<3?'top3':''}">${i+1}</span><span><b>${t.name}</b><small class="muted" style="display:block">${t.code}</small></span><b class="yellow desktop">${t.badges}/8 medaglie</b><b>${money(t.balance)}</b></div>`).join('')}</section>`}
    function transferPage(code=''){scannedRecipient=null;if(code){setTimeout(()=>identifyTrainerCode(code),0);return '<section class="panel form success"><h2>Identificazione allenatore…</h2></section>'}let trainers=state.trainers.filter(t=>t.id!==me().id&&t.code!==me().code);setTimeout(()=>startQrScanner('transfer'),0);return header('Invio Pokédollari','Scegli il destinatario','Scansiona il Pokédex oppure scegli un allenatore dalla lista.')+`<section class="panel pad form"><h2>Scansiona QR</h2><div id="qr-reader"></div><div id="scan-message" class="muted" style="margin-top:14px;text-align:center">Consenti l’accesso alla fotocamera oppure scegli un’immagine del QR.</div></section><h2 style="margin-top:30px">Invia a distanza</h2><section class="panel list">${trainers.map(t=>`<button class="row" style="width:100%;border:0;color:inherit;text-align:left;background:transparent" onclick="selectTransferTrainer('${t.code}')"><span class="rank">${t.name.slice(0,1).toUpperCase()}</span><span><b>${t.name}</b><small class="muted" style="display:block">${t.code}</small></span><b class="yellow">Seleziona</b></button>`).join('')||'<div class="pad muted">Nessun altro allenatore disponibile.</div>'}</section>`}
    function selectTransferTrainer(code){let t=state.trainers.find(x=>x.code===code);if(!t||t.code===me().code)return;scannedRecipient={trainer_code:t.code,trainer_name:t.name};document.querySelector('#app').innerHTML=transferForm(scannedRecipient)}
    function transferForm(recipient){return header('Destinatario identificato','Invia Pokédollari',`${recipient.trainer_name} · ${recipient.trainer_code}`)+`<form class="panel pad form" onsubmit="sendMoney(event)"><div class="stat"><small>Destinatario</small><b>${recipient.trainer_name}</b><span class="muted">${recipient.trainer_code}</span></div><label>Importo<input id="amount" class="field" type="number" min="1" step="1" required placeholder="0"></label><small class="muted">Disponibili: ${money(me().balance)}</small><label>Causale facoltativa<textarea id="note" class="field" maxlength="140"></textarea></label><div id="error"></div><button class="btn primary" style="width:100%;margin-top:20px">Controlla e conferma</button><button type="button" class="btn secondary" style="width:100%;margin-top:8px" onclick="go('transfer')">Scegli un altro destinatario</button></form>`}
    async function sendMoney(e){e.preventDefault();let amount=Number(document.querySelector('#amount').value),note=document.querySelector('#note').value,errorBox=document.querySelector('#error');if(!scannedRecipient||!Number.isInteger(amount)||amount<=0){errorBox.innerHTML='<div class="notice">Importo non valido.</div>';return}if(amount>me().balance){errorBox.innerHTML='<div class="notice">Saldo insufficiente.</div>';return}if(!confirm(`CONFERMA FINALE\n\nMittente: ${me().name}\nDestinatario: ${scannedRecipient.trainer_name}\nImporto: ${money(amount)}\nSaldo dopo: ${money(me().balance-amount)}`))return;let button=e.submitter;button.disabled=true;let {error}=await supabaseClient.rpc('transfer_pokedollars',{p_receiver_code:scannedRecipient.trainer_code,p_amount:amount,p_description:note,p_operation_id:crypto.randomUUID()});if(error){errorBox.innerHTML='<div class="notice">Trasferimento non riuscito. Controlla saldo e destinatario.</div>';button.disabled=false;return}await loadRemoteProfile();await loadRemoteTransactions();document.querySelector('#app').innerHTML=`<section class="panel form success"><div class="big">✓</div><h2>Trasferimento completato</h2><p class="muted">Hai inviato ${money(amount)} a ${scannedRecipient.trainer_name}.</p><button class="btn primary" onclick="go('transactions')">Vedi movimenti</button></section>`}
    function transactionsPage(){return header('Registro personale','Storico movimenti','I Pokédollari ricevuti sono verdi, quelli inviati hanno il segno meno.')+`<section class="panel">${state.transactions.map(txLine).join('')||'<div class="pad muted">Non ci sono ancora movimenti.</div>'}</section>`}
    async function updateBugContestQuickStatus(){const badge=document.querySelector('#bug-contest-quick-status');if(!badge)return;const {data,error}=await supabaseClient.rpc('get_bug_game_status');if(!badge.isConnected)return;badge.textContent=error?'Non disponibile':data.isOpen?'Aperta':'Giovedì';badge.className='quick-event-status'+(!error&&data.isOpen?' open':'');}
    const fossilImages={'Fossilhelix':'fossilhelix.png','Domofossil':'domofossil.png','Radiofossile':'radiofossile.png','Fossilunghia':'fossilunghia.png','Fossilcranio':'fossilcranio.png','Fossilscudo':'fossilscudo.png','Ambra Antica':'ambra antica.png'};

s="status ${status.className}">${status.label}</span><b class="yellow">${money(g.price)}</b></div><h2>${g.name}</h2><p class="muted">${g.badge}<br>${new Date(g.date).toLocaleString('it-IT')}<br>${g.location}</p><div class="actions"><button class="btn secondary" onclick="editGym('${g.id}')">Modifica</button><button class="btn secondary" onclick="toggleGym('${g.id}')">${g.open?'Chiudi iscrizioni':'Apri iscrizioni'}</button><button class="btn danger" onclick="deleteGym('${g.id}')">Rimuovi</button></div></article>`}).join('')||'<article class="panel pad">Nessuna palestra programmata.</article>'}</section>`}
    async function findBadgeByName(name){let {data,error}=await supabaseClient.from('badges').select('id,name,position').ilike('name',name.trim()).maybeSingle();if(error||!data)throw new Error('Medaglia non trovata. Usa uno dei nomi configurati in Supabase.');return data}
    async function adminGym(e){e.preventDefault();let form=e.currentTarget,values=Object.fromEntries(new FormData(form)),button=e.submitter;button.disabled=true;try{let badge=await findBadgeByName(values.badge),eventDate=new Date(values.eventDate),openAt=new Date(values.openAt),closeAt=new Date(values.closeAt);if([eventDate,openAt,closeAt].some(d=>Number.isNaN(d.getTime())))throw new Error('Controlla le date inserite.');if(closeAt<=openAt)throw new Error('La chiusura iscrizioni deve essere successiva all’apertura.');if(eventDate<closeAt)throw new Error('L’evento deve essere successivo alla chiusura delle iscrizioni.');let {error}=await supabaseClient.from('gyms').insert({name:values.name.trim(),badge_id:badge.id,description:values.description.trim(),event_date:eventDate.toISOString(),event_location:values.location.trim(),ticket_price:Number(values.price),minimum_ranking_points:Number(values.minimum),maximum_participants:Number(values.maximum),registration_open_at:openAt.toISOString(),registration_close_at:closeAt.toISOString(),is_registration_open:values.open==='on'});if(error)throw error;form.reset();await loadRemoteGyms();render()}catch(error){alert('Creazione non riuscita: '+error.message);button.disabled=false}}
    function editGym(id){let g=state.gyms.find(x=>x.id===id);if(!g)return;document.querySelector('#gym-edit-modal')?.remove();let options=badgeNames.map(name=>`<option ${name===g.badge?'selected':''}>${name}</option>`).join('');document.body.insertAdjacentHTML('beforeend',`<div id="gym-edit-modal" class="modal-backdrop" onclick="if(event.target===this)this.remove()"><form class="panel pad modal-card" onsubmit="saveGymEdit(event,'${g.id}')"><h2 style="margin-top:0">Modifica palestra</h2><div class="admin-form-grid"><label>Nome evento<input class="field" name="name" required value="${escapeHtml(g.name)}"></label><label>Tipo di medaglia<select class="field" name="badge">${options}</select></label><label class="wide">Descrizione<textarea class="field" name="description" required>${escapeHtml(g.description)}</textarea></label><label>Data e ora evento<input class="field" name="eventDate" type="datetime-local" required value="${dateTimeLocalValue(g.date)}"></label><label>Luogo<input class="field" name="location" required value="${escapeHtml(g.location)}"></label><label>Apertura iscrizioni<input class="field" name="openAt" type="datetime-local" required value="${dateTimeLocalValue(g.openAt)}"></label><label>Chiusura iscrizioni<input class="field" name="closeAt" type="datetime-local" required value="${dateTimeLocalValue(g.closeAt)}"></label><label>Costo Pokédollari<input class="field" name="price" type="number" min="0" step="1" required value="${g.price}"></label><label>Posti massimi<input class="field" name="maximum" type="number" min="1" step="1" required value="${g.max}"></label><label>Punti minimi<input class="field" name="minimum" type="number" min="0" step="1" required value="${g.minPoints}"></label></div><div class="form-actions"><button class="btn primary">Salva modifiche</button><button type="button" class="btn secondary" onclick="document.querySelector('#gym-edit-modal').remove()">Annulla</button></div></form></div>`)}
    async function saveGymEdit(e,id){e.preventDefault();let values=Object.fromEntries(new FormData(e.currentTarget)),button=e.submitter;button.disabled=true;try{let badge=await findBadgeByName(values.badge),eventDate=new Date(values.eventDate),openAt=new Date(values.openAt),closeAt=new Date(values.closeAt);if(closeAt<=openAt)throw new Error('La chiusura iscrizioni deve essere successiva all’apertura.');if(eventDate<closeAt)throw new Error('L’evento deve essere successivo alla chiusura delle iscrizioni.');let {error}=await supabaseClient.from('gyms').update({name:values.name.trim(),badge_id:badge.id,description:values.description.trim(),event_date:eventDate.toISOString(),event_location:values.location.trim(),ticket_price:Number(values.price),minimum_ranking_points:Number(values.minimum),maximum_participants:Number(values.maximum),registration_open_at:openAt.toISOString(),registration_close_at:closeAt.toISOString(),updated_at:new Date().toISOString()}).eq('id',id);if(error)throw error;document.querySelector('#gym-edit-modal')?.remove();await loadRemoteGyms();render()}catch(error){alert('Modifica non riuscita: '+error.message);button.disabled=false}}
    async function toggleGym(id){let g=state.gyms.find(x=>x.id===id);if(!g)return;let {error}=await supabaseClient.from('gyms').update({is_registration_open:!g.open,updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert('Aggiornamento non riuscito: '+error.message);await loadRemoteGyms();render()}
    async function deleteGym(id){let g=state.gyms.find(x=>x.id===id);if(!g||!confirm(`Rimuovere definitivamente ${g.name}?`))return;let {error}=await supabaseClient.from('gyms').delete().eq('id',id);if(error)return alert('Eliminazione non riuscita: '+(error.message.includes('foreign key')?'esistono iscrizioni collegate a questo evento.':error.message));await loadRemoteGyms();render()}
    function adminRocketEvents(){let event=state.rocketEvents.find(e=>e.active),pokemon=state.rocketPokemon.filter(p=>p.eventId===event?.id);return header('Amministrazione','Lista Team Rocket','Aggiorna evento, data e Pokémon mostrati nella lista pubblica.')+`<div class="admin-tools"><button class="btn primary" onclick="createRocketEvent()">Nuovo evento</button>${event?`<button class="btn secondary" onclick="editRocketEvent('${event.id}')">Modifica evento</button><button class="btn secondary" onclick="addRocketPokemon('${event.id}')">Aggiungi Pokémon</button><button class="btn danger" onclick="deleteRocketEvent('${event.id}')">Rimuovi evento</button>`:''}</div>${event?`<section class="panel pad event-banner"><div><span class="status valid">Attivo</span><h2>${event.name}</h2><p class="muted">${new Date(event.date).toLocaleString('it-IT')}</p></div><div class="event-count"><b>${pokemon.length}</b><small>Pokémon in lista</small></div></section><section class="panel list" style="margin-top:18px">${pokemon.map(p=>`<article class="row"><span class="rank">●</span><span><b>${p.name}</b><small class="muted" style="display:block">${p.stock>0&&p.available?'Disponibile':p.stock<=0?'Esaurito':'Non ancora disponibile'} · quantità ${p.stock}</small></span><b class="yellow desktop">${money(p.price)}</b><span class="row-actions"><button class="btn secondary" onclick="editRocketPokemon('${p.id}')">Modifica</button><button class="btn danger" onclick="deleteRocketPokemon('${p.id}')">Rimuovi</button></span></article>`).join('')||'<div class="pad">Nessun Pokémon inserito.</div>'}</section>`:'<section class="panel pad">Nessun evento attivo.</section>'}`}
    async function createRocketEvent(){let name=prompt('Nome evento','Team Rocket – '+new Date().toLocaleString('it-IT',{month:'long'}));if(!name)return;let month=prompt('Mese (deve essere il primo giorno: YYYY-MM-01)',new Date().toISOString().slice(0,7)+'-01'),date=prompt('Data evento ISO',new Date().toISOString().slice(0,10)+'T16:00:00');if(!month||!date)return;let off=await supabaseClient.from('rocket_events').update({is_active:false,updated_at:new Date().toISOString()}).eq('is_active',true);if(off.error)return alert('Creazione non riuscita: '+off.error.message);let {error}=await supabaseClient.from('rocket_events').insert({name:name.trim(),event_month:month,event_date:date,is_active:true});if(error)return alert('Creazione non riuscita: '+error.message);await loadRemoteRocket();render()}
    async function editRocketEvent(id){let e=state.rocketEvents.find(x=>x.id===id),name=prompt('Nome evento',e?.name);if(!e||!name)return;let changes={name:name.trim(),event_month:prompt('Mese (YYYY-MM-01)',e.month)||e.month,event_date:prompt('Data e ora ISO',e.date)||e.date,updated_at:new Date().toISOString()};let {error}=await supabaseClient.from('rocket_events').update(changes).eq('id',id);if(error)return alert('Modifica non riuscita: '+error.message);await loadRemoteRocket();render()}
    async function deleteRocketEvent(id){let e=state.rocketEvents.find(x=>x.id===id);if(!e||!confirm(`Rimuovere ${e.name} e la relativa lista Pokémon?`))return;let {error}=await supabaseClient.from('rocket_events').delete().eq('id',id);if(error)return alert('Eliminazione non riuscita: '+(error.message.includes('foreign key')?'esistono dati collegati a questo evento.':error.message));await loadRemoteRocket();render()}
    async function addRocketPokemon(eventId){if(!eventId)return alert('Crea prima un evento.');let name=prompt('Nome Pokémon');if(!name)return;let {error}=await supabaseClient.from('rocket_pokemon').insert({rocket_event_id:eventId,pokemon_name:name.trim(),price:Math.max(0,Number(prompt('Costo in Pokédollari','500'))),stock_quantity:Math.max(0,Number(prompt('Quantità disponibile','5'))),is_available:confirm('Renderlo subito disponibile?')});if(error)return alert('Inserimento non riuscito: '+error.message);await loadRemoteRocket();render()}
    async function editRocketPokemon(id){let p=state.rocketPokemon.find(x=>x.id===id);if(!p)return;let changes={price:Math.max(0,Number(prompt('Costo',p.price))),stock_quantity:Math.max(0,Number(prompt('Quantità',p.stock))),is_available:confirm('OK = disponibile; Annulla = non ancora disponibile'),updated_at:new Date().toISOString()};let {error}=await supabaseClient.from('rocket_pokemon').update(changes).eq('id',id);if(error)return alert('Modifica non riuscita: '+error.message);await loadRemoteRocket();render()}
    async function deleteRocketPokemon(id){let p=state.rocketPokemon.find(x=>x.id===id);if(!p||!confirm(`Rimuovere ${p.name} dalla lista?`))return;let {error}=await supabaseClient.from('rocket_pokemon').delete().eq('id',id);if(error)return alert('Eliminazione non riuscita: '+error.message);await loadRemoteRocket();render()}
    function randomToken(){let bytes=new Uint8Array(12);crypto.getRandomValues(bytes);return 'PDX-'+Array.from(bytes,b=>b.toString(36).padStart(2,'0')).join('').toUpperCase()}
    async function loadRemoteDevices(){if(!supabaseClient||remoteProfile?.role!=='admin')return;let {data,error}=await supabaseClient.from('pokedex_devices').select('id,activation_token,status,trainer_id,created_at,activated_at,disabled_at,replaced_at,replaced_by_pokedex_id').order('created_at',{ascending:false});if(error){alert('Impossibile caricare i Pokédex: '+error.message);return}state.devices=data.map(d=>({id:d.id,token:d.activation_token,status:d.status,trainerId:d.trainer_id,created:d.created_at,activatedAt:d.activated_at,disabledAt:d.disabled_at,replacedAt:d.replaced_at,replacedBy:d.replaced_by_pokedex_id}));remoteDevicesLoaded=true;render()}
    async function generatePokedex(){let qty=Math.min(50,Math.max(1,Number(prompt('Quanti Pokédex vuoi generare? (1-50)','1'))||0));if(!qty)return;let {data,error}=await supabaseClient.rpc('generate_pokedex_devices',{p_quantity:qty});if(error){alert('Generazione non riuscita: '+error.message);return}remoteDevicesLoaded=false;await loadRemoteDevices();alert(`${data?.length||qty} Pokédex generati in Supabase.`)}
    function adminPokedex(){if(!remoteDevicesLoaded)setTimeout(loadRemoteDevices,0);setTimeout(()=>state.devices.forEach((d,i)=>{let c=document.querySelector(`#pdx-${i}`);if(c)QRCode.toCanvas(c,activationLink(d.token),{width:130,margin:1})}),0);return header('Amministrazione','Gestione Pokédex','Genera codici reali in Supabase, stampa QR e controlla lo stato dei dispositivi.')+`<div class="admin-tools"><button class="btn primary" onclick="generatePokedex()">Genera Pokédex</button><button class="btn secondary" onclick="print()">Stampa / salva PDF</button><button class="btn secondary" onclick="exportPokedex()">Esporta CSV</button></div><section class="catalog">${state.devices.map((d,i)=>`<article class="panel product qr"><span class="status ${d.status==='activated'?'valid':d.status==='available'?'ready':'cancelled'}">${d.status}</span><canvas id="pdx-${i}"></canvas><b class="ticket-code">${maskToken(d.token)}</b><small class="muted">Creato: ${new Date(d.created).toLocaleString('it-IT')}<br>${d.trainerId?'Allenatore associato':'Non assegnato'}</small><div class="actions no-print"><button class="btn secondary" onclick="openActivationLink('${d.token}')">Apri link di prova</button><button class="btn secondary" onclick="copyActivationLink('${d.token}')">Copia link</button><button class="btn secondary" onclick="downloadDeviceQr(${i},'${d.id}')">Scarica PNG</button>${['available','disabled'].includes(d.status)&&!d.trainerId?`<button class="btn secondary" style="border-color:#a7192266;color:#ff9da3" onclick="deletePokedex('${d.id}')">Elimina Pokédex</button>`:''}${d.status==='activated'?'<small class="muted">I Pokédex attivati possono essere sostituiti, non eliminati.</small>':''}</div></article>`).join('')||'<article class="panel pad">Caricamento o nessun Pokédex generato.</article>'}</section>`}
    function trainerLink(code){return location.href.split('#')[0]+'#trainer/'+encodeURIComponent(String(code).trim().toUpperCase())}
    function activationLink(token){return location.href.split('#')[0]+'#activate/'+encodeURIComponent(token.trim().toUpperCase())}

    async function deletePokedex(id){let device=state.devices.find(d=>d.id===id);if(!device||!confirm(`Eliminare definitivamente il Pokédex ${maskToken(device.token)}?\n\nIl QR smetterà immediatamente di funzionare.`))return;let {error}=await supabaseClient.rpc('delete_unassigned_pokedex',{p_pokedex_id:id});if(error){alert(error.message.includes('POKEDEX_CANNOT')?'Un Pokédex già assegnato non può essere eliminato.':`Eliminazione non riuscita: ${error.message}`);return}state.devices=state.devices.filter(d=>d.id!==id);remoteDevicesLoaded=true;render()}

    function adminRewards(){if(!remoteRewardsLoaded)setTimeout(loadRewards,0);setTimeout(()=>remoteRewards.forEach((r,i)=>{let c=document.querySelector(`#reward-qr-${i}`);if(c)QRCode.toCanvas(c,rewardLink(r.token),{width:180})}),0);return header('Premio partecipazione','QR da 100 Pokédollari','Ogni allenatore può riscattare ciascun QR una sola volta.')+`<div class="admin-tools"><button class="btn primary" onclick="generateReward()">Genera QR da 100 ₽</button><button class="btn secondary" onclick="print()">Stampa / salva PDF</button></div><section class="catalog">${remoteRewards.map((r,i)=>`<article class="panel product qr"><span class="status ${r.is_active?'valid':'cancelled'}">${r.is_active?'Attivo':'Disattivato'}</span><canvas id="reward-qr-${i}"></canvas><h2>${r.event_name}</h2><b class="yellow" style="font-size:24px">+ ${money(r.amount)}</b><small class="muted">Creato ${new Date(r.created_at).toLocaleString('it-IT')}</small><div class="actions no-print"><button class="btn secondary" onclick="downloadRewardQr(${i},'${r.id}')">Scarica PNG</button><button class="btn secondary" onclick="navigator.clipboard.writeText(rewardLink('${r.token}'))">Copia link</button></div></article>`).join('')||'<article class="panel pad">Nessun QR premio generato.</article>'}</section>`}
    async function generateReward(){let name=prompt('Nome evento','Evento Champion League');if(!name)return;let {error}=await supabaseClient.rpc('generate_event_reward_code',{p_event_name:name});if(error){alert('Generazione non riuscita: '+error.message);return}remoteRewardsLoaded=false;await loadRewards()}

    async function claimReward(token){if(!confirm('Accreditare 100 Pokédollari sul tuo account?'))return;let {data,error}=await supabaseClient.rpc('claim_event_reward',{p_token:decodeURIComponent(token),p_operation_id:crypto.randomUUID()}),box=document.querySelector('#claim-error');if(error){await loadRemoteProfile();box.innerHTML=`<div class="notice">${error.message.includes('ALREADY_CLAIMED')?`Hai già riscattato questo QR. Saldo attuale: ${money(me().balance)}`:error.message.includes('NOT_AVAILABLE')?'Questo QR premio non è disponibile.':error.message.includes('NOT_FOUND_OR_INACTIVE')?'Profilo non trovato o account non attivo.':'Riscatto non riuscito.'}</div>`;return}await loadRemoteProfile();document.querySelector('#app').innerHTML=`<section class="panel form success"><div class="big">✓</div><h2>Premio accreditato</h2><p class="yellow" style="font-size:28px;font-weight:900">+ ${money(data?.[0]?.amount||100)}</p><p class="muted">Nuovo saldo: ${money(data?.[0]?.new_balance||me().balance)}</p><button class="btn primary" onclick="go('dashboard')">Torna alla dashboard</button></section>`}

    async function generateBadgeQr(){let position=Number(prompt('Numero medaglia: 1 Roccia, 2 Acqua, 3 Elettro, 4 Erba, 5 Veleno, 6 Psico, 7 Fuoco, 8 Terra','1'));if(position<1||position>8)return;let badge=await supabaseClient.from('badges').select('id,name').eq('position',position).maybeSingle();if(badge.error||!badge.data)return alert('Medaglia non trovata nel database.');let label=prompt('Nome della palestra o evento',`Palestra ${badge.data.name}`);if(!label)return;let {error}=await supabaseClient.rpc('generate_gym_badge_code',{p_badge_id:badge.data.id,p_label:label});if(error)return alert('Generazione non riuscita: '+error.message);remoteBadgeCodesLoaded=false;await loadBadgeCodes()}

    async function refreshAuthProfile(){if(passwordRecovery)return;await loadRemoteProfile();await completePendingTrainerProfile();let dailyReward=await claimDailyLoginReward();await Promise.all([loadPublicTrainers(),loadRemoteTransactions(),loadNotifications(),loadRemoteRegistrations(),loadRemoteGyms(),loadRemoteRocket()]);authReady=true;updateAuthButton();render();if(dailyReward)alert(`Premio giornaliero!\n\nHai ricevuto ${dailyReward.amount} Pokédollari.\nNuovo saldo: ${money(dailyReward.new_balance)}`)}
    async function initializeAuth(){if(!supabaseClient){authReady=true;render();return}if(!authListenerInstalled){authListenerInstalled=true;supabaseClient.auth.onAuthStateChange((event,session)=>{authSession=session;if(event==='PASSWORD_RECOVERY'){passwordRecovery=true;recoveryError='';authReady=true;history.replaceState(null,'',location.pathname+'?recovery=1#reset-password');updateAuthButton();render();return}if(passwordRecovery||event==='INITIAL_SESSION'||event==='USER_UPDATED')return;clearTimeout(authRefreshTimer);authRefreshTimer=setTimeout(()=>{refreshAuthProfile().catch(()=>{authReady=true;render()})},0)})}try{let {data,error}=await supabaseClient.auth.getSession();authSession=data?.session||null;if(passwordRecovery){if(error)recoveryError=error.message;authReady=true;updateAuthButton();render();return}await refreshAuthProfile();if(!notificationPoll)notificationPoll=setInterval(async()=>{if(authSession&&!passwordRecovery){await loadNotifications();if(location.hash==='#notifications')render()}},30000)}catch(error){authReady=true;if(passwordRecovery)recoveryError=error.message;render()}}

    function updateAuthButton(){let b=document.querySelector('#auth-button'),register=document.querySelector('#register-button'),notifications=document.querySelector('#notification-button');if(!b)return;b.textContent=authSession?'Esci':'Accedi';if(register)register.classList.toggle('hidden',!!authSession);if(notifications){let unread=remoteNotifications.filter(n=>!n.is_read).length;notifications.classList.toggle('hidden',!authSession);notifications.textContent=unread?`🔔 ${unread}`:'🔔'}}
    async function handleAuthButton(){if(authSession){await supabaseClient.auth.signOut();go('login')}else go('login')}
    function resetDemo(){if(confirm('Ripristinare tutti i dati demo?')){localStorage.removeItem('champion-league');location.reload()}}
    let starterRenderVersion=0;
    new MutationObserver(()=>{
      const page=location.hash.slice(1).split('/')[0];
      if(!['fossil-hunt'].includes(page)||!authSession||!remoteProfile)return;
      const app=document.querySelector('#app');if(app.querySelector('[data-starter-companion]'))return;
      const host=document.createElement('aside');host.className='panel pad';host.dataset.starterCompanion='';host.style.marginBottom='16px';app.prepend(host);
      const userId=authSession.user.id;
      starterModule().then(module=>module.mountCompanion(host,{client:supabaseClient,isCurrent:()=>authSession?.user.id===userId&&location.hash.slice(1).split('/')[0]===page})).catch(()=>{});
    }).observe(document.querySelector('#app'),{childList:true});
    const starterModule=()=>import('./features/starter/starter-ui.js?v=johto-7');
    const safariModule=()=>window.ChampionSafari?Promise.resolve(window.ChampionSafari):Promise.reject(Error('File features/safari/safari-runtime.js non caricato. Pubblica tutta la cartella features/safari accanto a index.html.'));
    const casinoModule=()=>window.ChampionCasino?Promise.resolve(window.ChampionCasino):Promise.reject(Error('File features/casino/casino-runtime.js non caricato. Verifica che la cartella features sia accanto a index.html.'));
    function render(){
      const starterVersion=++starterRenderVersion;
      let hash=location.hash.slice(1)||'dashboard',[page,param]=hash.split('/');
      if(['gym','admin-gyms','tournaments'].includes(page)){location.replace('#events'+(page==='tournaments'&&param?'/'+param:''));return;}
      if(page==='test-gara-pigliamosche'){location.replace('#bug-contest');return;}
      if(page==='test-gara-pesca'){location.replace('#fishing');return;}
      if(page==='pokeathlon'){location.replace('#casino');return;}
      const requiresAdmin=page==='admin'||page.startsWith('admin-')||page==='ticket'||page==='gift-ticket';
      const requiresAuth=['dashboard','regions','my-starter','fossil-arena','transfer','transactions','my-tickets','qr','scan','claim','badge','bug-contest','fossil-hunt','events','tournaments','casino','pokeathlon','fishing','safari','gifts'].includes(page)||requiresAdmin;
      document.querySelector('#nav').innerHTML=navItems.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');
      if(!authReady){document.querySelector('#app').innerHTML='<section class="panel form success"><h2>Connessione sicura…</h2></section>';return}
      if(page==='forgot-password'){document.querySelector('#app').innerHTML=forgotPasswordPage();return}
      if(passwordRecovery||page==='reset-password'){document.querySelector('#app').innerHTML=passwordResetPage();return}
      if(page==='password-updated'){document.querySelector('#app').innerHTML=header('Account Champion League','Password aggiornata','La nuova password è stata salvata. Puoi usarla per i prossimi accessi.')+'<section class="panel pad"><button class="btn primary" onclick="go(&quot;dashboard&quot;)">Vai alla Home</button></section>';return}
      if(page==='register'){document.querySelector('#app').innerHTML=registerPage();return}
      if(page==='login'||(requiresAuth&&!authSession)){document.querySelector('#app').innerHTML=authPage();return}
      if(requiresAdmin&&remoteProfile?.role!=='admin'){document.querySelector('#app').innerHTML=activationMessage('Accesso negato','Questa sezione è riservata agli amministratori autorizzati.');return}
      if(requiresAuth&&!remoteProfile){document.querySelector('#app').innerHTML=activationMessage('Pokédex non attivato','Scansiona il QR del tuo Pokédex per creare la Scheda Allenatore.');return}
      if(page==='bug-contest'){
        const host=document.createElement('div'),userId=authSession.user.id;
        host.id='bug-contest-feature';host.textContent='Caricamento Gara Pigliamosche…';document.querySelector('#app').replaceChildren(host);
        import('./features/bug-contest/game.mjs?v=official-1').then(module=>{
          if(starterRenderVersion!==starterVersion)return;
          return module.mountBugContest(host,{client:supabaseClient,userId,onBalance:value=>{if(authSession?.user.id===userId&&remoteProfile&&Number.isFinite(value)){const changed=remoteProfile.balance!==value;remoteProfile.balance=value;if(changed){loadRemoteTransactions();loadPublicTrainers();}}},isCurrent:()=>starterRenderVersion===starterVersion&&authSession?.user.id===userId});
        }).catch(error=>{if(host.isConnected)host.textContent='Impossibile caricare la Gara Pigliamosche: '+error.message;});return;
      }
      if(page==='regions'){
        const host=document.createElement('div'),userId=authSession.user.id;
        host.id='regions-feature';host.textContent='Caricamento delle destinazioni…';document.querySelector('#app').replaceChildren(host);
        import('./features/regions/regions.mjs?v=johto-2').then(module=>{
          if(starterRenderVersion!==starterVersion)return;
          return module.mountRegions(host,{client:supabaseClient,isCurrent:()=>starterRenderVersion===starterVersion&&authSession?.user.id===userId,onBalance:value=>{if(authSession?.user.id===userId&&remoteProfile&&Number.isFinite(value)){const changed=remoteProfile.balance!==value;remoteProfile.balance=value;if(changed){loadRemoteTransactions();loadPublicTrainers();}}}});
        }).catch(error=>{if(host.isConnected)host.textContent='Impossibile caricare le destinazioni. Riprova.';console.error(error);});return;
      }
      if(page==='fishing'){
        const host=document.createElement('div'),userId=authSession.user.id;
        document.querySelector('#app').replaceChildren(host);
        host.textContent='Caricamento della Gara di Pesca…';
        import('./features/fishing/game.mjs?v=pesca-johto-7').then(module=>{
          if(starterRenderVersion!==starterVersion)return;
          return module.mountFishing(host,{client:supabaseClient,userId,onBalance:value=>{if(authSession?.user.id===userId&&remoteProfile&&Number.isFinite(value)){const changed=remoteProfile.balance!==value;remoteProfile.balance=value;if(changed){loadRemoteTransactions();loadPublicTrainers();}}},isCurrent:()=>starterRenderVersion===starterVersion&&authSession?.user.id===userId});
        }).catch(error=>{if(host.isConnected)host.textContent='Impossibile caricare la pesca: '+error.message;});return;
      }
      if(page==='events'){
        document.querySelector('#app').innerHTML='<div id="tournaments-feature">Caricamento eventi…</div>';
        const host=document.querySelector('#tournaments-feature'),userId=authSession.user.id;
        if(!window.ChampionTournaments){host.textContent='Sezione Eventi non disponibile. Verifica di aver caricato la cartella features/tournaments.';return;}
        window.ChampionTournaments.mountTournaments(host,{client:supabaseClient,onBalance:value=>{if(authSession?.user.id===userId&&remoteProfile&&remoteProfile.balance!==value){remoteProfile.balance=value;loadRemoteTransactions();loadPublicTrainers();}},initialId:param,isCurrent:()=>starterRenderVersion===starterVersion&&authSession?.user.id===userId}).catch(error=>{if(host.isConnected)host.textContent='Impossibile caricare gli eventi. Riprova.';console.error(error);});return;
      }
      if(page==='casino'){
        document.querySelector('#app').innerHTML='<div id="casino-feature">Caricamento Casinò di Zafferanopoli…</div>';
        const host=document.querySelector('#casino-feature'),userId=authSession.user.id;
        casinoModule().then(module=>{if(starterRenderVersion!==starterVersion)return;return module.mountCasino(host,{client:supabaseClient,isCurrent:()=>starterRenderVersion===starterVersion&&authSession?.user.id===userId,onBalance:value=>{if(authSession?.user.id===userId&&remoteProfile){const changed=remoteProfile.balance!==value;remoteProfile.balance=value;if(changed){loadRemoteTransactions();loadPublicTrainers();}}}})}).catch(error=>{if(host.isConnected){const target=host.shadowRoot||host;target.innerHTML='<section role="alert"><h2>Casinò non disponibile</h2><p>Errore durante il caricamento della pagina.</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></section>';target.querySelector('pre').textContent=error?.message||String(error);console.error(error);}});return;
      }
      if(page==='safari'){
        document.querySelector('#app').innerHTML='<div id="safari-feature">Caricamento Zona Safari…</div>';
        const host=document.querySelector('#safari-feature'),userId=authSession.user.id;
        safariModule().then(module=>{if(starterRenderVersion!==starterVersion)return;return module.mountSafari(host,{client:supabaseClient,isCurrent:()=>starterRenderVersion===starterVersion&&authSession?.user.id===userId,onBalance:value=>{if(authSession?.user.id===userId&&remoteProfile){const changed=remoteProfile.balance!==value;remoteProfile.balance=value;if(changed){loadRemoteTransactions();loadPublicTrainers();}}}})}).catch(error=>{if(host.isConnected){const target=host.shadowRoot||host;target.innerHTML='<section role="alert"><h2>Zona Safari non disponibile</h2><p>Il caricamento della sezione non è riuscito.</p><button type="button">Ricarica</button><details open><summary>Dettagli dell’errore</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></details></section>';target.querySelector('pre').textContent=error?.message||String(error);target.querySelector('button').addEventListener('click',()=>location.reload());console.error(error);}});return;
      }
      if(['my-starter','fossil-arena'].includes(page)){
        document.querySelector('#app').innerHTML='<div id="starter-feature">Caricamento del tuo starter…</div>';
        const host=document.querySelector('#starter-feature'),userId=authSession.user.id;
        starterModule().then(module=>{if(starterRenderVersion!==starterVersion)return;return module.mountStarter(host,{client:supabaseClient,section:page==='fossil-arena'?'arena':'starter',isCurrent:()=>starterRenderVersion===starterVersion&&authSession?.user.id===userId,onBalance:value=>{if(authSession?.user.id===userId&&remoteProfile){const changed=remoteProfile.balance!==value;remoteProfile.balance=value;if(changed)loadRemoteTransactions();}}})}).catch(error=>{console.error('Avvio Il mio Starter non riuscito:',error);if(host.isConnected){const target=host.shadowRoot||host;target.innerHTML='<section role="alert"><h2>Il mio Starter non è disponibile</h2><p>Non è stato possibile avviare la sezione. Riprova caricando la versione aggiornata.</p><button type="button" class="btn primary">Ricarica</button><details><summary>Dettaglio errore</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></details></section>';target.querySelector('pre').textContent=error instanceof Error?error.name+': '+error.message:String(error);target.querySelector('button').addEventListener('click',()=>location.reload());}});return;
      }
      let views={dashboard,gifts:giftsPage,ranking:rankingPage,transfer:transferPage,transactions:transactionsPage,'my-tickets':myTickets,qr:qrPage,scan:scanPage,gym:gymPage,'rocket-list':rocketPage,'fossil-hunt':fossilHuntPage,admin,'admin-gifts':adminGifts,'admin-gyms':adminGyms,'admin-tickets':adminTickets,'admin-badges':adminBadgeManagement,'admin-pokedex':adminPokedex,'admin-rewards':adminRewards,'admin-badge-qrs':adminBadgeQrs,'admin-rocket-events':adminRocketEvents};
      if(page==='activate'){document.querySelector('#app').innerHTML=activationPage(param);return}
      if(page==='claim'){document.querySelector('#app').innerHTML=claimRewardPage(param);return}
      if(page==='badge'){document.querySelector('#app').innerHTML=claimBadgePage(param);return}
      if(page==='gift-ticket'){document.querySelector('#app').innerHTML=giftTicketPage(param);return}
      if(page==='ticket'){let r=state.registrations.find(x=>x.code===param),g=r&&state.gyms.find(x=>x.id===r.gymId);document.querySelector('#app').innerHTML=r?header('Verifica biglietto',r.code,`${trainer(r.trainerId)?.name} · ${g?.name}`)+`<section class="panel pad form" style="text-align:center"><span class="status ${r.status}">${r.status}</span><h2>${r.status==='valid'?'Biglietto valido':'Biglietto non utilizzabile'}</h2>${r.status==='valid'?`<button class="btn primary" onclick="checkin('${r.id}')">Segna come utilizzato</button>`:''}</section>`:'<h1>Biglietto non trovato</h1>';return}
      document.querySelector('#app').innerHTML=page==='trainer'?publicTrainer(param):page==='transfer'?transferPage(param):(views[page]||dashboard)();
      if(page==='dashboard'&&authSession){
        let actions=document.querySelector('#app .actions');
        if(actions)actions.insertAdjacentHTML('beforeend',`<button class="btn secondary" type="button" onclick="go('regions')">✈ Visita una regione</button>`);
        if(actions)actions.insertAdjacentHTML('afterbegin','<button class="btn primary with-icon" onclick="go(\'my-starter\')"><img class="btn-icon" src="./pokeball%20icon.png" alt="">Il mio Starter</button><button class="btn secondary with-icon" type="button" onclick="go(\'events\')"><img class="btn-icon" src="./pokeball%20icon.png" alt="">Eventi</button><button class="btn secondary with-icon" onclick="go(\'fossil-arena\')"><img class="btn-icon" src="./roccia%20icon.png" alt="">Arena Fossili · solo lunedì</button>');
        if(actions){actions.insertAdjacentHTML('beforeend','<button class="btn secondary quick-event-button" type="button" onclick="go(\'bug-contest\')"><img class="btn-icon" src="./net%20ball%20icon.png" alt=""><span>Gara Pigliamosche</span><span id="bug-contest-quick-status" class="quick-event-status">Verifica…</span></button><button class="btn secondary quick-event-button" type="button" onclick="go(\'fossil-hunt\')"><img class="btn-icon" src="./roccia%20icon.png" alt=""><span>Caccia ai Fossili</span><span id="fossil-hunt-quick-status" class="quick-event-status">Verifica…</span></button><button class="btn secondary quick-event-button" type="button" onclick="go(\'casino\')"><img class="btn-icon" src="./pokeball%20icon.png" alt=""><span>Casinò di Zafferanopoli</span><span id="casino-quick-status" class="quick-event-status">Verifica…</span></button>');updateBugContestQuickStatus();updateFossilQuickStatus();updateCasinoQuickStatus()}
        if(actions){actions.insertAdjacentHTML('beforeend','<button class="btn secondary quick-event-button" type="button" onclick="go(\'fishing\')"><img class="btn-icon" src="./pesca%20icon.png" alt=""><span>Gara di Pesca</span><span id="fishing-quick-status" class="quick-event-status">Verifica…</span></button>');updateFishingQuickStatus()}
        if(actions){actions.insertAdjacentHTML('beforeend','<button class="btn secondary quick-event-button" type="button" onclick="go(\'safari\')"><img class="btn-icon" src="./paras.png" alt=""><span>Zona Safari</span><span id="safari-quick-status" class="quick-event-status">Verifica…</span></button>');updateSafariQuickStatus()}
        if(actions)actions.insertAdjacentHTML('beforeend','<button class="btn secondary with-icon" type="button" onclick="go(\'gifts\')"><img class="btn-icon" src="./pokeball%20icon.png" alt=""><span>Regali</span></button>');
        document.querySelector('#app').insertAdjacentHTML('beforeend','<section class="panel pad no-print" style="margin-top:28px"><span class="eyebrow">Account</span><div class="form-actions"><button class="btn secondary" type="button" onclick="enablePushNotifications()">🔔 Attiva notifiche</button><button class="btn danger" type="button" onclick="handleAuthButton()">↪ Esci dall’account</button></div></section>');
      }
      if(page==='admin'){
        let tools=document.querySelector('#app .admin-tools');
        if(tools)tools.insertAdjacentHTML('beforeend','<button class="btn primary" type="button" onclick="go(\'events\')">Gestisci eventi</button>');
        if(tools)tools.insertAdjacentHTML('beforeend','<button class="btn secondary" type="button" onclick="go(\'admin-gifts\')">Gestisci regali</button><button class="btn secondary" type="button" onclick="go(\'admin-badges\')">Gestisci medaglie</button><button class="btn secondary" type="button" onclick="go(\'fossil-hunt\')">Test Fossili</button><button class="btn secondary" type="button" onclick="go(\'fishing\')">Gara di Pesca</button><button class="btn secondary" type="button" onclick="go(\'bug-contest\')">Gara Pigliamosche</button><button class="btn secondary" type="button" onclick="go(\'safari\')">Test Safari</button><button class="btn secondary" type="button" onclick="go(\'casino\')">Casinò · risultati del venerdì</button>');
      }
    }
    async function checkSupabase(){let el=document.querySelector('#supabase-status');if(!supabaseClient){el.textContent='Supabase: non configurato';return}try{let {error}=await supabaseClient.from('badges').select('id',{head:true,count:'exact'});if(error)throw error;el.textContent='Supabase: connesso';el.style.color='#48d597';setTimeout(()=>el.remove(),3500)}catch(error){el.textContent=error.code==='PGRST205'?'Supabase: schema da installare':'Supabase: connessione non riuscita';el.style.color='#ff9da3'}}
    addEventListener('hashchange',()=>{if(activeScanner){activeScanner.clear().catch(()=>{});activeScanner=null}render()});initializeAuth();checkSupabase();
  </script>
