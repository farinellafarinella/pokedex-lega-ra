<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulazione fossili · Smartphone</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#080c10;color:#edf0e8;font:14px system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;border-bottom:1px solid #ffffff20}header strong{display:block}header small{color:#a5b0ba}button,a{font:inherit;color:#edf0e8}button{border:1px solid #ffffff40;border-radius:9px;background:#1a222b;padding:10px 16px;cursor:pointer}a{color:#63c4ad}.controls{display:flex;align-items:center;gap:14px}.stage{display:flex;justify-content:center;padding:16px 8px}.frame-space{position:relative}.phone{position:absolute;left:0;top:0;border:6px solid #303841;border-radius:26px;overflow:hidden;background:#101419;box-shadow:0 18px 70px #0009;transform-origin:top left}iframe{display:block;border:0;background:#101419}@media(max-width:600px){header{padding:10px;font-size:12px}.controls{gap:8px}.controls a{display:none}button{padding:9px}.stage{padding:10px 4px}}
</style></head><body><header><div><strong>Simulazione smartphone</strong><small id="dimensions">390 × 844 · verticale</small></div><div class="controls"><button id="rotate" type="button">Ruota schermo</button><a href="./index.html">Apri senza cornice</a></div></header><main class="stage"><div class="frame-space"><div class="phone"><iframe src="./index.html" title="Caccia ai Fossili in modalità smartphone"></iframe></div></div></main><script>
let landscape=false;const frame=document.querySelector('iframe'),phone=document.querySelector('.phone'),space=document.querySelector('.frame-space');function fit(){const width=landscape?844:390,height=landscape?390:844;const scale=Math.min(1,(innerWidth-20)/(width+12),Math.max(220,innerHeight-document.querySelector('header').offsetHeight-34)/(height+12));frame.style.width=width+'px';frame.style.height=height+'px';phone.style.width=(width+12)+'px';phone.style.height=(height+12)+'px';phone.style.transform='scale('+scale+')';space.style.width=(width+12)*scale+'px';space.style.height=(height+12)*scale+'px';document.querySelector('#dimensions').textContent=width+' × '+height+' · '+(landscape?'orizzontale':'verticale');}document.querySelector('#rotate').onclick=()=>{landscape=!landscape;fit()};addEventListener('resize',fit);fit();
</script></body></html>
